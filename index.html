<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1D1611" />
    <meta
      name="description"
      content="Golden Aura admin atelier — catalogue, orders, customers, coupons, delivery, reviews and inquiries."
    />
    <title>Golden Aura · Admin Atelier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        min-height: 100%;
      }
      body {
        margin: 0;
        background-color: #fbf8f3;
        color: #241a12;
        font-family: 'Jost', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      button,
      input,
      select,
      textarea {
        font-family: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: inherit;
      }
      ::selection {
        background: #e9d3a9;
        color: #241a12;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: #d9cbb6;
        border-radius: 20px;
        border: 3px solid #fbf8f3;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      @keyframes ga-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes ga-fade-up {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes ga-toast-in {
        from {
          opacity: 0;
          transform: translateX(18px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @keyframes ga-shimmer {
        from {
          background-position: 200% 0;
        }
        to {
          background-position: -200% 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
